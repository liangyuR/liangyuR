# 生成贪吃蛇贡献图（青钢配色）
# 产物会被推到本仓库的 output 分支，README 通过 raw.githubusercontent 引用。
name: Generate Snake

on:
  schedule:
    # 每天 UTC 18:00 = 北京时间次日 02:00 重新生成一次
    - cron: "0 18 * * *"
  # 也可以在 Actions 页面手动点一下运行
  workflow_dispatch:
  # 每次 push 到默认分支时顺手更新一次（默认分支不是 main 的话改这里）
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      # 需要写权限才能推到 output 分支
      contents: write

    steps:
      - name: 生成 SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#B9EBFF&color_dots=#171C1F,#344A52,#006782,#0F819E,#7FD4F0
            dist/snake-light.svg?palette=github-light&color_snake=#00363F&color_dots=#EFF4F7,#CEE6EF,#7FD4F0,#0F819E,#006782

      - name: 推送到 output 分支
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
