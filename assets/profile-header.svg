<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">LiangYu — Robotics, Vision and Automation</title>
  <desc id="description">A dark blue technical banner for LiangYu's GitHub profile.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.52" stop-color="#101b2a"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.77" cy="0.48" r="0.45">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7dd3fc" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="2"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="72" y="76" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="4">LIANGYU / BUILDER</text>
    <text x="72" y="158" fill="#f8fafc" font-size="64" font-weight="750" letter-spacing="-2">Robotics · Vision</text>
    <text x="72" y="222" fill="#e2e8f0" font-size="54" font-weight="650" letter-spacing="-1">&amp; Automation</text>
    <rect x="72" y="255" width="350" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="72" y="302" fill="#a8b3c5" font-size="22">把感知、规划与控制变成可运行的工具</text>
  </g>
  <g transform="translate(945 178)" fill="none">
    <circle r="116" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1"/>
    <circle r="88" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
    <circle r="58" stroke="#7dd3fc" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle r="18" fill="#0ea5e9" fill-opacity="0.16" stroke="#38bdf8" stroke-width="2" filter="url(#softGlow)"/>
    <path d="M-140 0H140M0-140V140" stroke="#38bdf8" stroke-opacity="0.13"/>
    <path d="M-82 66L-26 12L22 43L84-52" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-82" cy="66" r="7" fill="#0d1117" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="-26" cy="12" r="7" fill="#0d1117" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="22" cy="43" r="7" fill="#0d1117" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="84" cy="-52" r="7" fill="#0d1117" stroke="#22d3ee" stroke-width="3" filter="url(#softGlow)"/>
    <path d="M75-52H93M84-61V-43" stroke="#e0f2fe" stroke-width="1.5"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="1126" cy="54" r="3" opacity="0.8"/>
    <circle cx="1102" cy="76" r="2" opacity="0.4"/>
    <circle cx="798" cy="286" r="3" opacity="0.5"/>
    <circle cx="838" cy="306" r="2" opacity="0.35"/>
  </g>
</svg>
